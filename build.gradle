plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0-skeleton'
group = 'com.steelandcrowns'

base {
    archivesName = 'steelandcrowns'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

sourceSets.main.resources { srcDir 'src/main/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'steelandcrowns',
                'Specification-Vendor'    : 'You',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion.get(),
                'Implementation-Vendor'   : 'You'
        ])
    }
}
