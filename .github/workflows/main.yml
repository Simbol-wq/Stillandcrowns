name: Build Steel & Crowns

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip mod source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Zip-архив с исходниками не найден в корне репозитория"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Wire up Gradle project files
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -type d -name java -path '*/src/main/java' | head -n1)")
          PROJECT_DIR=$(dirname "$(dirname "$PROJECT_DIR")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cp build.gradle settings.gradle gradle.properties "$PROJECT_DIR/"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --console=plain

      - name: Upload built jar(s)
        uses: actions/upload-artifact@v4
        with:
          name: steelandcrowns-build
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          retention-days: 30
